<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- White diamond with dark border -->
  <rect x="18" y="18" width="84" height="84" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.5" transform="rotate(45, 60, 60)"/>
  <!-- Black inner square with rounded corners -->
  <rect x="36" y="36" width="48" height="48" rx="7" fill="#1a1a1a"/>
  <!-- White J in Georgia serif -->
  <text x="60" y="62" text-anchor="middle" dominant-baseline="central" font-family="Georgia, serif" font-size="30" font-weight="400" fill="#ffffff">J</text>
</svg>
